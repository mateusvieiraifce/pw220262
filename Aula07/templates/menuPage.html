<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='menu.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='crud.css') }}">
   
    {% block css %}
    {% endblock %}
</head>
<body>
    <nav>
        <div class="navbar">
            <h1 style="color: white;">Logo</h1>
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <ul class="menu" id="menu">
                <li><a href="{{url_for('lista_usuarios')}}">Usuários</a></li>`
                <li><a href="{{url_for('list_produto')}}">Produtos</a></li>
                <li><a href="#">Serviços</a></li>
                <li><a href="#">Fornecedores</a></li>
                <li><a href="#">Contas</a></li>
                <li><a href="#">Caixa</a></li>
                <li><a href="#">Vendas</a></li>
            </ul>
        </div>
    </nav>

    <script>
        const hamburger = document.getElementById('hamburger');
        const menu = document.getElementById('menu');

        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            menu.classList.toggle('active');
        });

        // Fechar menu ao clicar em um link
        document.querySelectorAll('.menu a').forEach(link => {
            link.addEventListener('click', () => {
                hamburger.classList.remove('active');
                menu.classList.remove('active');
            });
        });
    </script>
</body>
{% block content %}
{% endblock %}
</html>
