<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cadastro de Usuário</title>
    <style>
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			font-family: Arial, sans-serif;
			background: linear-gradient(135deg, #eef2ff, #dbeafe);
			color: #1f2937;
		}
		.login-card {
			width: min(90%, 400px);
			padding: 2.5rem;
			background: #fff;
			border-radius: 16px;
			box-shadow: 0 12px 35px rgba(30, 64, 175, .15);
		}
		h1 { margin: 0 0 .5rem; text-align: center; color: #1d4ed8; }
		.subtitle { margin: 0 0 2rem; text-align: center; color: #6b7280; }
		label { display: block; margin: 1rem 0 .4rem; font-weight: bold; }
		input {
			width: 100%;
			padding: .85rem 1rem;
			border: 1px solid #d1d5db;
			border-radius: 8px;
			font-size: 1rem;
		}
		input:focus { outline: 2px solid #93c5fd; border-color: #2563eb; }
		button {
			width: 100%;
			margin-top: 1.5rem;
			padding: .9rem;
			border: 0;
			border-radius: 8px;
			background: #2563eb;
			color: #fff;
			font-size: 1rem;
			font-weight: bold;
			cursor: pointer;
		}
		button:hover { background: #1d4ed8; }
		.forgot { display: block; margin-top: 1rem; text-align: center; color: #2563eb; text-decoration: none; }
		.forgot:hover { text-decoration: underline; }
	</style>
</head>
<body>
	

	<form action="{{url_for('salvar')}}" method="post">
		
        <main class="login-card">
            <h1>Cadastro de Usuário</h1>
        <div>
			<label for="nome">Nome:</label>
			<input type="text" id="nome" name="nome" required>
		</div>

		<div>
			<label for="usuario">Usuário:</label>
			<input type="text" id="usuario" name="usuario" required>
		</div>

		<div>
			<label for="senha">Senha:</label>
			<input type="password" id="senha" name="senha" required>
		</div>

		<div>
			<label for="nascimento">Data de nascimento:</label>
			<input type="date" id="nascimento" name="nascimento" required>
		</div>
        </main>

		<button type="submit">Cadastrar</button>
	</form>
</body>
</html>
