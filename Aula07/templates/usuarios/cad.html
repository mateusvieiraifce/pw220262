{% extends "menuPage.html"%}
{% block css %}
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='crud.css') }}">
{% endblock %}
{% block content %}
<div class="container">
  <h1> {{ "Edição" if usuario else "Cadastro" }} de Usuários </h1>

<form action="{{url_for('salvar')}}" method="post">
		<div class="_baixo_body">
        <main class="login-card">
        <div>
			<label for="nome">Nome:</label>
			<input type="text" id="nome" name="nome" required value="{{ usuario.nome if usuario else '' }}">
		</div>

		<div>
			<label for="usuario">Usuário:</label>
			<input type="text" id="usuario" name="usuario" required value="{{ usuario.usuario if usuario else '' }}">
		</div>


		

		{% if not usuario %}
			<div>
				<label for="senha">Senha:</label>
				<input type="password" id="senha" name="senha" required>
			</div>

			<div>
				<label for="nascimento">Data de nascimento:</label>
				<input type="date" id="nascimento" name="nascimento" required>
			</div>
		{% else %}
			<input type="hidden" name="id" value="{{ usuario.id }}">
				
		{% endif %}

    <button type="submit">Cadastrar</button>    
    </main>

		
        </div>
	</form>

</div>
{% endblock %}
